[package]
name = "dynamic-rust"
description = "A Rust implementation of the Dynamic REST wire protocol"
edition = "2024"
license = "MIT"
authors = ["alonetiev@gmail.com"]
repository = "https://github.com/aleontiev/dynamic-rust"
readme = "README.md"
include = ["src/**", "Cargo.toml", "README.md", "COMPATIBILITY.md", "LICENSE"]
rust-version = "1.88"
version = "0.1.0"

[features]
default = []
axum = ["dep:axum", "dep:tracing"]

[dependencies]
async-trait = "0.1.91"
axum = { version = "0.8.9", optional = true, features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tracing = { version = "0.1.44", optional = true }
url = "2.5.8"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
