[package]
name = "dynamic-rust"
description = "A Rust implementation of the Dynamic REST wire protocol"
edition = "2024"
license = "MIT"
authors = ["alonetiev@gmail.com"]
repository = "https://github.com/aleontiev/dynamic-rust"
readme = "README.md"
include = ["src/**", "Cargo.toml", "README.md", "COMPATIBILITY.md", "APPLICATION.md", "LICENSE"]
rust-version = "1.88"
version = "0.1.0"

[features]
default = []
axum = ["dep:axum", "dep:tracing"]
application = ["axum", "dep:sqlx", "dep:tokio", "dep:uuid", "dep:sha2", "dep:hmac", "dep:base64", "dep:reqwest", "dep:aws-sdk-sesv2"]

[dependencies]
async-trait = "0.1.91"
axum = { version = "0.8.9", optional = true, features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tracing = { version = "0.1.44", optional = true }
url = "2.5.8"

sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "migrate", "macros"] , optional = true }

tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] , optional = true }

uuid = { version = "1.22.0", features = ["serde", "v4"] , optional = true }

sha2 = { version = "0.10.9", optional = true }
hmac = { version = "0.12.1", optional = true }

base64 = { version = "0.22.1", optional = true }

reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] , optional = true }

aws-sdk-sesv2 = { version = "=1.82.0", default-features = false, features = ["default-https-client", "rt-tokio", "rustls"] , optional = true }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
